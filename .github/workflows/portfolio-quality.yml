name: Portfolio Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: |
          python -m py_compile notebooks/01_customer_360_python_analysis.py
          python -m py_compile notebooks/02_advanced_modelling.py
          python -m py_compile customer360_FINAL_BUILD.py

      - name: Validate portfolio assets
        run: |
          python - <<'PY'
          from pathlib import Path

          required = [
              "README.md",
              "requirements.txt",
              "docs/TECHNICAL_ARCHITECTURE.md",
              "reports/python_analysis_summary.txt",
              "reports/advanced_modelling_summary.txt",
              "powerbi/Customer_360_Revenue_Growth_Dashboard.pbip",
              "images/readme/customer360_hero.svg",
              "images/powerbi/01_executive_overview.png",
              "images/powerbi/02_customer_retention.png",
              "images/powerbi/03_acquisition_product_performance.png",
              "images/powerbi/04_forecasting_experimentation.png",
              "images/powerbi/05_marketing_performance.png",
          ]

          missing = [p for p in required if not Path(p).exists()]
          if missing:
              raise SystemExit("Missing required assets: " + ", ".join(missing))

          print("Portfolio validation passed.")
          PY
